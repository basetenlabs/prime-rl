# Self-distillation replication: ToolAlpaca tool-use task
# Paper: "Self-Distillation Enables Continual Learning" (arXiv:2601.19897)
#
# GPU layout for 8xH200:
#   - 2 GPUs for inference (vLLM rollout generation)
#   - 6 GPUs for training (FSDP)

output_dir = "outputs/self-distill-tooluse"
inference_gpu_ids = [0, 1]
trainer_gpu_ids = [2, 3, 4, 5, 6, 7]
seq_len = 4096
max_steps = 127
max_async_level = 0

[wandb]
project = "self-distill-replication"
name = "tooluse-forward-kl"

[ckpt]
interval = 50
keep_last = 3

[model]
name = "Qwen/Qwen2.5-7B-Instruct"

# --- Trainer ---

[trainer]
max_concurrent_runs = 1
dist_timeout_seconds = 1800

[trainer.model]
fused_lm_head_chunk_size = "disabled"
attn = "flash_attention_2"

[trainer.model.ac]
# Activation checkpointing

[trainer.optim]
type = "adamw"
lr = 2e-5
weight_decay = 0.01
max_norm = 1.0

[trainer.scheduler]
type = "cosine"
warmup_steps = 13
min_lr = 0.0

[trainer.loss]
type = "self_distill"
divergence = "forward_kl"
top_k = 64
ema_alpha = 0.01
loss_mask_prefix_tokens = 3

# --- Orchestrator ---

[orchestrator]
batch_size = 32
rollouts_per_example = 1
max_async_level = 0
max_off_policy_steps = 0

[orchestrator.sampling]
temperature = 1.0
max_tokens = 1024

[[orchestrator.env]]
id = "tooluse-self-distill"
name = "tooluse"
args = { dataset_path = "replication_data/converted/train_data.json", eval_dataset_path = "replication_data/converted/eval_data.json" }

[orchestrator.val]
interval = 25
num_examples = 68

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
max_tokens = 1024

[[orchestrator.eval.env]]
id = "tooluse-self-distill"
name = "tooluse"
num_examples = 68
args = { dataset_path = "replication_data/converted/train_data.json", eval_dataset_path = "replication_data/converted/eval_data.json" }

# --- Inference ---

[inference.parallel]
dp = 2
